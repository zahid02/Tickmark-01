<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tickmark</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500;700&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
/* Layout & Theme Tokens */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEB; --ink:#14201C; --ink-2:#50615B; --line:#D3DDD8;
  --accent:#D97706; --accent-ink:#FFFFFF; --accent-soft:#FEF3C7;
  --gold:#C98A0B; --gold-ink:#1E1400;
  --bad:#B4412F; --bad-ink:#FFFFFF; --bad-soft:#F6DDD7;
  --hero-bg:#78350F; --hero-ink:#FFFBEB; --hero-dim:#FDE68A; --hero-line:rgba(255,255,255,.18);
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#151E1B; --surface-2:#1E2925; --ink:#E5EFEA; --ink-2:#9AACA5; --line:#26332E;
    --accent:#FBBF24; --accent-ink:#1C1102; --accent-soft:#36260B;
    --gold:#F0B94A; --gold-ink:#1E1400;
    --bad:#F08A78; --bad-ink:#2A0E09; --bad-soft:#3A1E19;
    --hero-bg:#451A03; --hero-ink:#FEF3C7; --hero-dim:#FCD34D; --hero-line:rgba(255,255,255,.16);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151E1B; --surface-2:#1E2925; --ink:#E5EFEA; --ink-2:#9AACA5; --line:#26332E;
  --accent:#FBBF24; --accent-ink:#1C1102; --accent-soft:#36260B;
  --gold:#F0B94A; --gold-ink:#1E1400;
  --bad:#F08A78; --bad-ink:#2A0E09; --bad-soft:#3A1E19;
  --hero-bg:#451A03; --hero-ink:#FEF3C7; --hero-dim:#FCD34D; --hero-line:rgba(255,255,255,.16);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{
  margin:0;
  background:var(--bg); color:var(--ink); font:400 15px/1.5 var(--font-body); -webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));
}
img{max-width:100%}
[hidden]:not([hidden="until-found"]){display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:16px;min-width:0}
.muted{color:var(--ink-2)} .small{font-size:13px}
.mono{font-family:var(--font-mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 1. STICKY FROSTED-GLASS TOP NAVIGATION BAR */
.top-sticky{
  position:sticky;
  top:0;
  z-index:40;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  padding-bottom:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent);
}
.top-inner{
  max-width:980px;
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:10px;font:700 20px var(--font-display);letter-spacing:-.02em}
.brand svg{width:28px;height:28px;transition:transform .2s}
.brand:hover svg{transform:scale(1.05)}
.sync{font:500 11px var(--font-mono);color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}

/* 2. COLOR-CODED & THEME-REACTIVE SECTION TABS */
.tabs{
  display:flex;
  gap:6px;
  background:var(--surface);
  padding:5px;
  border-radius:15px;
  border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.tabs button{
  --tab-c:var(--accent);
  --tab-bg:var(--accent-soft);
  border:1px solid transparent;
  background:transparent;
  padding:8px 13px;
  border-radius:11px;
  font-weight:700;
  font-size:13.5px;
  cursor:pointer;
  color:var(--ink-2);
  min-height:38px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  transition:all .18s cubic-bezier(.2,.8,.2,1);
  position:relative;
}
.tabs button svg{
  width:15px;
  height:15px;
  flex:none;
  opacity:.75;
  transition:transform .18s ease, opacity .18s ease;
}
.tabs button[data-tab="dash"]{ --tab-c:var(--accent); --tab-bg:var(--accent-soft); }
.tabs button[data-tab="prog"]{ --tab-c:#0F7B6C; --tab-bg:color-mix(in srgb,#10B981 16%,var(--surface)); }
.tabs button[data-tab="lib"] { --tab-c:#2563EB; --tab-bg:color-mix(in srgb,#3B82F6 16%,var(--surface)); }
.tabs button[data-tab="rew"] { --tab-c:#7C3AED; --tab-bg:color-mix(in srgb,#8B5CF6 16%,var(--surface)); }

:root[data-theme="dark"] .tabs button[data-tab="prog"]{ --tab-c:#34D399; }
:root[data-theme="dark"] .tabs button[data-tab="lib"] { --tab-c:#60A5FA; }
:root[data-theme="dark"] .tabs button[data-tab="rew"] { --tab-c:#C084FC; }

.tabs button:hover:not([aria-current="page"]){
  background:var(--tab-bg);
  color:var(--tab-c);
}
.tabs button:hover svg{opacity:1;transform:translateY(-1px)}
.tabs button[aria-current="page"]{
  background:var(--tab-bg);
  color:var(--tab-c);
  border-color:color-mix(in srgb,var(--tab-c) 42%,transparent);
  box-shadow:0 2px 6px color-mix(in srgb,var(--tab-c) 18%,transparent);
}
.tabs button[aria-current="page"] svg{
  opacity:1;
  stroke-width:2.4;
}
.tab-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--tab-c);
  display:none;
}
.tabs button[aria-current="page"] .tab-dot{display:inline-block}
@media (max-width:640px){
  .tabs{order:3;flex:1 1 100%;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px}
  .tabs button{padding:7px 4px;font-size:12px;gap:4px;flex-direction:column;min-height:46px}
  .tabs button svg{width:16px;height:16px}
  .tab-dot{position:absolute;top:5px;right:6px;width:5px;height:5px}
}

/* BOTTOM TAB BAR (Dashboard / Progress / Library / Rewards) */
.bottom-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  transform:translateZ(0);-webkit-transform:translateZ(0);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid color-mix(in srgb,var(--line) 75%,transparent);
}
.bottom-bar .tabs{
  max-width:980px;margin:0 auto;
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px;
}
.bottom-bar .tabs button{padding:7px 4px;font-size:12px;gap:4px;flex-direction:column;min-height:50px}
.bottom-bar .tabs button svg{width:18px;height:18px}
.bottom-bar .tab-dot{position:absolute;top:5px;right:8px;width:5px;height:5px}
.top-sticky{border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent)}
.top-sticky .top-inner{flex-wrap:nowrap}
body:not(.studying) .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:11px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px;text-decoration:none;transition:transform .14s ease, box-shadow .14s ease, background-color .14s ease}
.btn:active:not([disabled]){transform:scale(.98)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.btn.danger{background:var(--bad);color:var(--bad-ink);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.icon{padding:0;width:40px}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}

/* 3. THEMED COLORED BACK BUTTON IN FOLDERS */
.btn-back-themed{
  background:var(--accent-soft);
  color:var(--accent);
  border:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent);
  font-weight:700;
  border-radius:10px;
  padding:6px 12px;
  min-height:34px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  box-shadow:0 2px 6px color-mix(in srgb,var(--accent) 14%,transparent);
  transition:transform .15s ease, background-color .15s ease, box-shadow .15s ease;
}
.btn-back-themed:hover{
  background:color-mix(in srgb,var(--accent) 22%,var(--surface));
  transform:translateY(-1px);
  box-shadow:0 4px 10px color-mix(in srgb,var(--accent) 22%,transparent);
}
.btn-back-themed:active{
  transform:translateY(1px);
}

/* 5. MIDNIGHT GOLD 3D TACTILE HERO CTA BUTTON */
.btn-midnight-gold{
  width:100%;justify-content:center;
  background:linear-gradient(180deg, #FDE047 0%, #FACC15 55%, #EAB308 100%);
  color:#1A1200;
  font-weight:800;
  font-size:14.5px;
  border:1px solid #FEF08A;
  border-radius:14px;
  padding:11px 20px 11px 14px;
  display:inline-flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  min-height:46px;
  box-shadow:0 4px 0 #A16207, 0 8px 20px rgba(234, 179, 8, 0.35);
  transition:transform .12s cubic-bezier(.2,.8,.2,1), box-shadow .12s ease, filter .15s ease;
}
.btn-midnight-gold:hover{
  filter:brightness(1.03);
  transform:translateY(-1px);
  box-shadow:0 5px 0 #A16207, 0 11px 24px rgba(234, 179, 8, 0.42);
}
.btn-midnight-gold:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #A16207, 0 3px 8px rgba(234, 179, 8, 0.25);
}
.btn-midnight-gold .play-badge{
  width:26px;
  height:26px;
  border-radius:50%;
  background:rgba(26, 18, 0, 0.14);
  color:#1A1200;
  display:grid;
  place-items:center;
  flex:none;
}
.btn-midnight-gold .play-badge svg{
  width:12px;
  height:12px;
  margin-left:1.5px;
}

.fld{display:grid;gap:6px;min-width:0}
.fld>span{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
input[type=text],input:not([type]),select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
textarea{resize:vertical;line-height:1.45}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1 1 auto;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}

/* HERO CARD + POKEMON COMPANION */
.hero{
  background:linear-gradient(145deg, color-mix(in srgb,var(--accent) 78%,#111) 0%, var(--hero-bg) 100%);
  color:var(--hero-ink);
  border-radius:24px;
  padding:22px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:18px 28px;
  align-items:end;
  box-shadow:0 14px 32px -12px color-mix(in srgb,var(--accent) 45%,rgba(0,0,0,.45));
  position:relative;
  overflow:hidden;
}
.hero::before{
  content:"";
  position:absolute;
  top:-60px;
  right:-60px;
  width:220px;
  height:220px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.14) 0%, transparent 70%);
  pointer-events:none;
}
@media (max-width:600px){.hero{grid-template-columns:1fr;padding:18px}}
.hero-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
}
.eyebrow{font:600 11px var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--hero-dim)}
.buddy-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 11px;
  border-radius:999px;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.25);
  color:#FFFFFF;
  font:600 11.5px var(--font-mono);
  cursor:pointer;
  backdrop-filter:blur(6px);
  transition:background .15s, transform .15s;
}
.buddy-pill:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
.buddy-pill svg{width:13px;height:13px}

/* Pokemon Speech Bubble Callout */
.say{
  display:flex;
  gap:14px;
  align-items:center;
  margin:4px 0 12px;
}
.poke-avatar{
  width:74px;
  height:74px;
  border-radius:20px;
  background:rgba(255,255,255,.16);
  border:1.5px solid rgba(255,255,255,.32);
  box-shadow:0 8px 18px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.3);
  display:grid;
  place-items:center;
  flex:none;
  cursor:pointer;
  animation:pokeFloat 3.2s ease-in-out infinite;
  transition:transform .18s ease;
}
.poke-avatar:hover{transform:scale(1.06)}
.poke-avatar svg,.poke-avatar img{width:62px;height:62px;object-fit:contain}
.poke-avatar iframe{height:68px!important;border-radius:14px}
@keyframes pokeFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
@media (prefers-reduced-motion:reduce){.poke-avatar{animation:none}}

.speech-bubble{
  position:relative;
  background:rgba(255,255,255,.96);
  color:#131C18;
  border-radius:18px 18px 18px 6px;
  padding:13px 16px;
  box-shadow:0 10px 24px -6px rgba(0,0,0,.25);
  flex:1;
  min-width:0;
}
.speech-bubble::before{
  content:"";
  position:absolute;
  left:-7px;
  bottom:14px;
  width:0;
  height:0;
  border-top:7px solid transparent;
  border-right:8px solid rgba(255,255,255,.96);
  border-bottom:7px solid transparent;
}
.speech-who{
  font:700 10.5px var(--font-mono);
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:3px;
  display:flex;
  align-items:center;
  gap:6px;
}
:root[data-theme="dark"] .speech-who{color:#92400E}
.hero h1.q{
  font-size:clamp(18px,3.4vw,24px);
  line-height:1.22;
  font-weight:800;
  color:#111827;
  margin:0;
}
.hero .sub{color:var(--hero-dim);margin-bottom:16px;font-size:13.5px;font-weight:500}
.streak{display:grid;justify-items:start;gap:0}
@media (min-width:601px){.streak{justify-items:end;text-align:right}}
.streak .n{font:800 72px/0.95 var(--font-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.streak .l{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--hero-dim)}
.week{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding-top:16px;border-top:1px solid var(--hero-line)}
.wd{display:grid;justify-items:center;gap:7px;font:600 10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--hero-dim)}
.wc{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--hero-line);display:grid;place-items:center}
.wc svg{width:18px;height:18px}
.wd.on .wc{background:#FFFFFF;border-color:#FFFFFF;color:var(--hero-bg)}
.wd.today{color:#FFFFFF}
.wd.fut{opacity:.45}
.hero-cta{grid-column:1/-1}
.wd.today .wc{box-shadow:0 0 0 3px var(--hero-bg),0 0 0 5px #FDE047}
#app{touch-action:pan-y}
/* Dashboard hero: dark card, set progress, two buttons, Saturday-first week */
.hero2{--hero-ink:#FFFFFF;--hy:color-mix(in srgb,var(--accent) 70%,#fff);
  grid-template-columns:1fr;gap:16px;padding:20px;border-radius:28px;align-items:stretch}
.hero2 .hero-top{margin-bottom:0;flex-wrap:nowrap}
.hero2 .say{margin:0}
.hero2 .poke-avatar{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14);box-shadow:none;width:78px;height:78px;border-radius:22px}
.hero2 .speech-who{color:#4B5563}
.top-r{display:inline-flex;align-items:center;gap:8px}
.streak-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font:700 14px var(--font-mono);color:#fff}
.buddy-pill.ico{padding:0;width:32px;height:32px;justify-content:center}
.buddy-pill.ico svg{width:15px;height:15px}
.setcard{display:grid;gap:6px;padding:11px 14px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);cursor:pointer;text-align:left;color:#fff}
.sc-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sc-name{display:flex;align-items:center;gap:8px;font:700 16px/1.25 var(--font-body);min-width:0;overflow-wrap:anywhere}
.sc-n{text-align:right;font:500 18px/1 var(--font-body);color:var(--hero-dim);white-space:nowrap}
.sc-n b{color:var(--hy);font-weight:800}
.sc-n small{display:block;font:400 12px var(--font-body);margin-top:2px;color:var(--hero-dim)}
.sc-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.sc-bar i{display:block;height:100%;background:var(--hy);border-radius:99px}
.sc-last{font-size:13px;color:var(--hero-dim)}
.hero2 .hero-cta{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.hero2 .hero-cta.one{grid-template-columns:1fr}
.hero2 .btn-midnight-gold{min-height:52px;font-size:15.5px}
.hero-ghost{min-height:52px;border-radius:14px;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-weight:800;font-size:15px}
.hero-ghost svg{width:18px;height:18px}
.goal-line{text-align:center;color:var(--hero-dim);font-size:15px;margin-top:-2px}





.hero2 .wd.fut{opacity:.4}

/* tiles & panels */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0;box-shadow:0 2px 6px rgba(0,0,0,.02)}
.tile .k{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tile .v{font:700 30px/1.15 var(--font-display);margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:13px;color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0;box-shadow:0 2px 8px rgba(0,0,0,.02)}
.panel h2{font-size:18px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font:500 10px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:center;padding-bottom:4px}
.day{aspect-ratio:1;border-radius:10px;background:var(--surface-2);position:relative;display:grid;place-items:center;color:var(--ink-2)}
.day i{position:absolute;top:4px;left:6px;font:500 10px var(--font-mono);font-style:normal}
.day svg{width:52%;height:52%}
.day.on{background:var(--accent);color:var(--accent-ink)}

function lvl(){ return Math.floor(G.xp/Math.max(1,G.xpLevel))+1; }
function chkUnl(){
  var l=lvl(),n=[];
  G.pk.forEach(function(p){
    if(!G.unl[p.id]&&((p.kind==='level'&&l>=p.val)||(p.kind==='xp'&&G.xp>=p.val))){
      G.unl[p.id]=Date.now();
      n.push(p.name);
    }
  });
  return n;
}
function saveG(){
  try{ localStorage.setItem('tickmark.v1.game',JSON.stringify(G)); }catch(e){}

    try{
      var pr=net.profile.set({seeded:true,game:clone(G)});

  }
}

/* Each character has its own pool: 1st = 20 quotes, 2nd = 30, 3rd = 40, 4th = 50.
   From the 5th character on, every character gets 50 quotes picked at random (fixed per character) from the whole bank. */
var QALL=[].concat.apply([],QBANK);
var QUOTE='';
function unlockRank(p){
  var un=G.pk.filter(function(x){ return G.unl[x.id]; }).sort(function(a,b){ return (G.unl[a.id]-G.unl[b.id]) || (G.pk.indexOf(a)-G.pk.indexOf(b)); });
  return un.indexOf(p);
}
function quotePool(p){
  var r=p?unlockRank(p):0; if(r<0) r=0;
  if(r<QBANK.length) return QBANK[r];
  var seed=0, id=String(p.id); for(var i=0;i<id.length;i++) seed=(seed*31+id.charCodeAt(i))>>>0;
  var rnd=function(){ seed=(seed+0x6D2B79F5)>>>0; var t=seed; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; };
  var a=QALL.slice(); for(var j=a.length-1;j>0;j--){ var k=Math.floor(rnd()*(j+1)), tmp=a[j]; a[j]=a[k]; a[k]=tmp; }
  return a.slice(0,50);
}
function currentBuddy(){ var un=G.pk.filter(function(p){ return G.unl[p.id]; }); return un.filter(function(x){ return x.id===G.partner; })[0]||un[0]||null; }
function ensureQuote(){
  var pool=quotePool(currentBuddy());
  if(pool.indexOf(QUOTE)<0){
    var last=''; try{ last=localStorage.getItem(LS+'.q')||''; }catch(e){}
    var i,n=pool.length; do{ i=Math.floor(Math.random()*n); }while(pool[i]===last&&n>1);
    QUOTE=pool[i]; try{ localStorage.setItem(LS+'.q',QUOTE); }catch(e){}
  }
  return QUOTE;
}
function cycleQuote(){ var pool=quotePool(currentBuddy()), idx=pool.indexOf(QUOTE); QUOTE=pool[(idx+1)%pool.length]; }

function onSnap(name,snap){
  var fc=snap.metadata.fromCache;

  if(!ready){

function settle(){
  ready=true; clearTimeout(loadTimer);
  var names=['folders','decks','days'];
  var anyRemote=names.some(function(n){ return Object.keys(remote[n].o).length>0; });
  var localHas=names.some(function(n){ return Object.keys(S[n]).length>0; });
  if(anyRemote){
    names.forEach(function(n){ S[n]=remote[n].o; });
    saveLocal();
  } else if(localHas){
    Object.keys(S.folders).forEach(function(id){ dbWrite('folders',id,S.folders[id]); });
    Object.keys(S.decks).forEach(function(id){ dbWrite('decks',id,S.decks[id]); });
    Object.keys(S.days).forEach(function(id){ dbWrite('days',id,S.days[id]); });
  }
  setSync('synced');
  net.profile.get().then(function(p){
    var pd=p.exists&&p.data(); if(pd&&pd.game){ Object.assign(G,pd.game); if(!G.pk) G.pk=defPk(); try{ localStorage.setItem('tickmark.v1.game',JSON.stringify(G)); }catch(e){} }

function computeStats(){
  var has=function(k){ return !!(S.days[k] && S.days[k].sets>0); };
  var now=new Date(), keys=Object.keys(S.days).filter(has).sort(), hs=function(k){ return has(k)||(G.sd||[]).indexOf(k)>-1; };
  var d=new Date(now); if(!hs(dkey(d))) d=addDays(d,-1);
  var streak=0; while(hs(dkey(d))){ streak++; d=addDays(d,-1); }
  var best=0,run=0,prev=null;
  keys.forEach(function(k){ if(prev && dkey(addDays(fromKey(prev),1))===k) run++; else run=1; if(run>best) best=run; prev=k; });
  var sets=0,secs=0; keys.forEach(function(k){ sets+=S.days[k].sets||0; secs+=S.days[k].secs||0; });
  var week=[], cardsWeek=0;
  for(var i=6;i>=0;i--){ var wk=S.days[dkey(addDays(now,-i))]; cardsWeek+=(wk&&wk.cards)||0; }
  var ws=addDays(now,-((now.getDay()+1)%7)), nk=dkey(now);
  for(var wi=0;wi<7;wi++){ var dd=addDays(ws,wi), k=dkey(dd); week.push({date:dd,key:k,on:has(k),today:k===nk,fut:k>nk}); }
  var c30=0,r30=0; for(var j=0;j<30;j++){ var x=S.days[dkey(addDays(now,-j))]; if(x){ c30+=x.cards||0; r30+=x.correct||0; } }
  var bars=[]; for(var b=6;b>=0;b--){ var bd=addDays(now,-b); bars.push({date:bd,cards:(S.days[dkey(bd)]&&S.days[dkey(bd)].cards)||0,secs:(S.days[dkey(bd)]&&S.days[dkey(bd)].secs)||0,today:b===0}); }
  return {streak:streak,best:best,sets:sets,week:week,cardsWeek:cardsWeek,acc:c30?Math.round(r30/c30*100):null,c30:c30,bars:bars,secs:secs,cards:counts(Object.values(S.decks)),has:has};

function barChart(data,lbl){
  var W=600,H=196,L=32,R=6,T=18,B=26, iw=W-L-R, ih=H-T-B;
  var mx=0; data.forEach(function(d){ if(d.v>mx) mx=d.v; });
  var top=niceMax(mx), bw=iw/data.length, out='';
  [0,top/2,top].forEach(function(v){
    var y=T+ih-ih*(v/top);
    out+='<line class="g" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="t" x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+v+'</text>';
  });
  data.forEach(function(d,i){
    var x=L+i*bw+bw*0.18, w=bw*0.64, h=ih*(d.v/top), y=T+ih-h;
    if(d.v>0){
      out+='<rect class="bar'+(d.today?' now':'')+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3"/>';
      out+='<text class="t" x="'+(x+w/2)+'" y="'+(y-4)+'" text-anchor="middle">'+d.v+'</text>';
    }
    out+='<text class="'+(d.today?'tb':'t')+'" x="'+(x+w/2)+'" y="'+(H-8)+'" text-anchor="middle">'+(d.label!=null?d.label:d.date.getDate())+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(lbl||'Chart')+' over the last 7 days">'+out+'</svg>';
}

function dayDetail(){
  var k=ui.sel; if(!k) return '';
  var d=S.days[k], b='<div class="prev" style="margin-top:12px"><b>'+esc(fmtDay(fromKey(k)))+'</b>';
  if(!d||!(d.cards||d.sets)) b+='<span class="muted">No study on this day.</span>';
  else b+='<span>'+(d.sets>0?'Ticked':'Not ticked')+' · '+plural(d.sets||0,'set')+' · '+plural(d.cards||0,'card')+' · '+(d.cards?Math.round(d.correct/d.cards*100):0)+'% right · '+fmtDur(d.secs||0)+'</span>'+(d.sessions||[]).map(function(x){ return '<div class="pr"><span>'+esc(x.name)+'</span><span class="muted">'+x.correct+'/'+x.total+'</span></div>'; }).join('');
  if(d&&d.note) b+='<div class="pr" style="grid-template-columns:1fr"><span style="white-space:pre-wrap;overflow:visible;text-overflow:clip;overflow-wrap:anywhere">'+esc(d.note)+'</span></div>';
  if(d&&d.gif) b+='<img class="dayg" src="'+esc(d.gif)+'" alt="GIF for this day">';
  b+='<button class="btn sm" data-act="dayNote" data-k="'+k+'" style="justify-self:start;margin-top:4px">'+IC.edit+(d&&(d.note||d.gif)?'Edit note or GIF':'Add note or GIF')+'</button>';
  return b+'</div>';
}

function cmpPanel(){
  var m=ui.cmp||'days', now=new Date(), rows=[], i, note='';
  if(m==='days'){ for(i=6;i>=0;i--){ var d=addDays(now,-i); rows.push({l:fmtDay(d),s:d.toLocaleDateString('en-US',{weekday:'short'}),r:rng(d,d),t:!i}); }
    var a=rng(addDays(now,-6),now), b=rng(addDays(now,-13),addDays(now,-7)), df=Math.round((a.secs-b.secs)/60);
    note='Last 7 days: '+Math.round(a.secs/60)+' min vs '+Math.round(b.secs/60)+' min in the 7 days before ('+(df>=0?'+':'−')+Math.abs(df)+' min).'; }
  else if(m==='weeks'){ for(i=4;i>=0;i--) rows.push({l:i?i+' wk ago':'This week',s:i?i+'w':'Now',r:rng(addDays(now,-7*i-6),addDays(now,-7*i)),t:!i}); note='Rolling 7-day weeks ending today.'; }
  else { for(i=5;i>=0;i--){ var a1=new Date(now.getFullYear(),now.getMonth()-i,1), e1=new Date(now.getFullYear(),now.getMonth()-i+1,0); rows.push({l:a1.toLocaleDateString('en-US',{month:'long',year:'numeric'}),s:a1.toLocaleDateString('en-US',{month:'short'}),r:rng(a1,e1),t:!i}); } }
  var data=rows.map(function(x){ return {label:x.s,today:x.t,v:Math.round(x.r.secs/6)/10}; });
  var dl=function(v){ return v===0?'<span class="muted">±0</span>':'<span class="'+(v>0?'up':'dn')+'">'+(v>0?'+':'−')+Math.abs(v)+'</span>'; };
  var btn=[['days','7 days'],['weeks','5 weeks'],['months','Monthly']].map(function(x){ return '<button class="btn sm'+(m===x[0]?' primary':'')+'" data-act="cmp" data-m="'+x[0]+'">'+x[1]+'</button>'; }).join('');
  return '<section class="panel cmp"><div class="phead"><h2>Compare progress</h2><div class="row">'+btn+'</div></div>'+(note?'<p class="muted small" style="margin-bottom:8px">'+note+'</p>':'')+(data.some(function(x){ return x.v>0; })?barChart(data,'Minutes'):'<p class="muted">Minutes appear here once you study.</p>')+
    rows.map(function(x,j){ var cm=Math.round(x.r.secs/60), pm=j?Math.round(rows[j-1].r.secs/60):null; return '<div class="sess"><div><b>'+esc(x.l)+'</b><div class="muted small">'+plural(x.r.cards,'card')+' · '+plural(x.r.sets,'set')+'</div></div><span class="sc">'+cm+' min '+(pm==null?'':dl(cm-pm))+'</span></div>'; }).reverse().join('')+'</section>';
}

  var nm = pkName(p);
  if(POKE_SVGS[nm]) return POKE_SVGS[nm];
  if(POKE_SVGS[p.name]) return POKE_SVGS[p.name];
  return ball(p.color,lock);
}

/* Subject Radar supporting 1, 2, or 3+ Subjects */
function radarPanel(){
  var sj=Object.values(S.folders).filter(function(f){ return f.subject; }).sort(byName), body;
  if(sj.length===0){
    body='<p class="muted">Mark any folder as a subject to see your time-spent radar (Library → New subject, or a folder’s ⋯ menu → Mark as subject).</p>';
  } else {
    var n=sj.length, W=400, H=350, Cx=200, Cy=172, Rr=95, o='';
    var secsOf=function(fid){ var t=0; subtree(fid).ds.forEach(function(id){ var d=S.decks[id]; if(d) t+=d.secs||0; }); return t; };
    var times=sj.map(function(f){ return secsOf(f.id); });
    var maxMin=Math.max.apply(null,times)/60, scaleMin=Math.max(5,niceMax(Math.ceil(maxMin)));
    var scaleLbl=function(m){ return m>=60?(Math.round(m/6)/10)+'h':Math.round(m)+'m'; };
    var vals=times.map(function(t){ return Math.min(100,Math.round(t/60/scaleMin*1000)/10); });

    var G=n>=3?n:6, ang=function(i){ return -Math.PI/2+2*Math.PI*i/n; };
    var P=function(a,r){ return [Cx+r*Math.cos(a),Cy+r*Math.sin(a)]; };
    var colOf=function(f){ return f.color||'var(--accent)'; };
    var fx=function(v){ return Math.round(v*10)/10; };
    /* grid rings */
    [25,50,75,100].forEach(function(v){
      var r=Rr*v/100, pts=[]; for(var k=0;k<G;k++) pts.push(P(-Math.PI/2+2*Math.PI*k/G,r).map(fx).join(','));
      o+='<polygon fill="none" stroke="var(--line)" stroke-width="1" points="'+pts.join(' ')+'"/>';
      o+='<text class="t" x="'+(Cx+4)+'" y="'+(Cy-r+10)+'">'+scaleLbl(scaleMin*v/100)+'</text>';
    });
    /* subject shapes, each in its folder colour */
    sj.forEach(function(f,i){
      var r=Rr*vals[i]/100; if(r<=0) return;
      var a=ang(i), d=n>=3?Math.PI/n:Math.PI/6, c=colOf(f);
      var k1=P(a-d,r*.55), k2=P(a,r), k3=P(a+d,r*.55);
      o+='<polygon fill="'+c+'" fill-opacity=".3" stroke="'+c+'" stroke-width="1.5" stroke-linejoin="round" points="'+[[Cx,Cy],k1,k2,k3].map(function(q){ return q.map(fx).join(','); }).join(' ')+'"/>';
    });
    /* axes with arrowheads, labels and dots */
    sj.forEach(function(f,i){
      var a=ang(i), c=colOf(f), tip=P(a,Rr+10), bs=P(a,Rr+2), nx=Math.cos(a+Math.PI/2)*4, ny=Math.sin(a+Math.PI/2)*4;
      o+='<line x1="'+Cx+'" y1="'+Cy+'" x2="'+fx(bs[0])+'" y2="'+fx(bs[1])+'" stroke="var(--ink-2)" stroke-width="1.5"/>';
      o+='<polygon fill="var(--ink-2)" points="'+[tip,[bs[0]+nx,bs[1]+ny],[bs[0]-nx,bs[1]-ny]].map(function(q){ return fx(q[0])+','+fx(q[1]); }).join(' ')+'"/>';
      var l=P(a,Rr+18), dx=l[0]-Cx, dy=l[1]-Cy, anc=Math.abs(dx)<8?'middle':dx>0?'start':'end';
      var nm=f.name.length>14?f.name.slice(0,13)+'…':f.name, y1,y2;
      if(Math.abs(dx)<8 && dy<0){ y1=l[1]-12; y2=l[1]; } else if(Math.abs(dx)<8){ y1=l[1]+8; y2=l[1]+20; } else { y1=l[1]+(dy<0?-3:dy>0?3:0)+2; y2=y1+11; }
      o+='<text class="tb" x="'+fx(l[0])+'" y="'+fx(y1)+'" text-anchor="'+anc+'" style="fill:'+c+'">'+esc(nm)+'</text>';
      o+='<text class="t" x="'+fx(l[0])+'" y="'+fx(y2)+'" text-anchor="'+anc+'">'+fmtDur(times[i])+'</text>';
    });
    sj.forEach(function(f,i){ var q=P(ang(i),Rr*vals[i]/100); o+='<circle cx="'+fx(q[0])+'" cy="'+fx(q[1])+'" r="4.5" fill="'+colOf(f)+'" stroke="var(--surface)" stroke-width="2"/>'; });
    o+='<circle cx="'+Cx+'" cy="'+Cy+'" r="2.5" fill="var(--ink-2)"/>';

    body='<svg class="chart" style="max-width:420px;margin:0 auto" viewBox="0 0 400 350" role="img" aria-label="Time spent by subject">'+o+'</svg>'+
      '<div class="list" style="margin-top:10px">'+sj.map(function(f,i){
        var c=folderCounts(f.id);
        return '<div class="li" data-act="goFolder" data-id="'+esc(f.id)+'" role="button" tabindex="0"><div class="r"><b>'+(f.color?'<i class="dot" style="background:'+f.color+'"></i>':'')+esc(f.name)+'</b><span class="muted small mono">'+fmtDur(times[i])+' spent · '+plural(c.cards,'card')+'</span></div>'+mbar(c,f.color)+'</div>';
      }).join('')+'</div>';
  }
  return '<section class="panel"><div class="phead"><h2>Subject radar</h2><span class="muted small mono">'+plural(sj.length,'subject')+' · time spent'+(sj.length?' · outer ring '+scaleLbl(scaleMin):'')+'</span></div>'+body+'</section>';
}

/* ---------- 4. UNIFIED BACK NAVIGATION (HARDWARE BACK / SWIPE BACK & UI BACK BUTTON) ---------- */
function goBack(fromPopstate){
  if(!modalEl.hidden){
    closeModal(true);
    if(!fromPopstate) popNavSync();
    return true;
  }
  if(ui.tab==='study'){
    exitStudy(false, fromPopstate);
    return true;
  }
  if(ui.deck){
    ui.deck=null;
    if(!fromPopstate) popNavSync();
    render(true);
    return true;
  }
  if(ui.tab==='lib' && ui.folder){
    ui.folder=(S.folders[ui.folder]||{}).parent||null;
    if(!fromPopstate) popNavSync();
    render(true);
    return true;
  }
  if(ui.tab==='vault' && ui.vf){
    ui.vf=(V.folders[ui.vf]||{}).parent||null;
    if(!fromPopstate) popNavSync();
    render(true);
    return true;
  }
  if(ui.tab!=='dash'){
    ui.tab='dash';
    if(!fromPopstate) popNavSync();
    render(true);
    return true;
  }
  return false;
}

var guardOn=false;
function armGuard(){ if(guardOn) return; try{ history.pushState({tm:1, guard:1}, ''); guardOn=true; }catch(e){} }
try{ history.replaceState({tm:1, base:1}, ''); }catch(e){}
/* Browsers skip history entries added before the page got a tap, so the guard is added on the first interaction. */
['pointerup','touchend','click','keydown'].forEach(function(ev){ document.addEventListener(ev,armGuard,{capture:true,passive:true}); });
window.addEventListener('popstate',function(){
  guardOn=false;
  var handled=goBack(true);
  if(handled) armGuard();
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Backspace') return;
  var t=e.target;
  if(t&&(/INPUT|TEXTAREA|SELECT/.test(t.tagName)||t.isContentEditable)) return;
  if(goBack(false)) e.preventDefault();
});

function studyView(){

  var txt=s.flipped?k.a:k.q, im=s.flipped?k.ai:k.qi, long=txt.length>120, fi=s.fl?' flip-in':(s.en?' enter':''); s.fl=false; s.en=false;
  var okN=0, noN=0; Object.keys(s.results).forEach(function(i){ if(s.results[i]) okN++; else noN++; });
  var nxt=s.i+1<s.queue.length;
  return '<div class="study cm"><div class="sbar"><button class="btn ghost icon" data-act="exit" aria-label="Leave this set">'+IC.close+'</button>'+buddyArt((S.folders[d&&d.folder]||{}).buddy)+
    '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="'+s.queue.length+'" aria-valuenow="'+s.i+'"><i style="width:'+(s.i/s.queue.length*100)+'%"></i></div>'+
    '<span class="mono small muted"><span id="tm">'+clock(s.el||0)+'</span> · '+(s.i+1)+' / '+s.queue.length+'</span></div>'+
    '<div class="pills"><span class="pill pk" id="pk" data-n="'+okN+'">'+okN+'</span><span class="pill pm" id="pm2" data-n="'+noN+'">'+noN+'</span></div><div class="fstack">'+(nxt?'<div class="fbehind" aria-hidden="true"></div>':'')+'<div class="flash'+(s.flipped?' back':'')+(long?' long':'')+fi+'" data-act="flip" role="button" tabindex="0" aria-label="Flip card" key="'+s.i+(s.flipped?'b':'f')+'"><span class="side">'+(s.flipped?'Answer':'Question')+'</span><button class="btn ghost icon sm star'+(k.star?' on':'')+'" data-act="starStudy" aria-label="Star this card" aria-pressed="'+!!k.star+'">'+(k.star?IC.starOn:IC.star)+'</button><span class="ftx">'+(im?'<img class="fimg" src="'+esc(im)+'" alt="" draggable="false">':'')+esc(txt)+'</span><span class="swlbl" aria-hidden="true"></span></div></div>'+
    (s.flipped?

      :'<button class="btn primary" data-act="flip" style="min-height:54px;font-size:16px">Show answer</button>')+
    '<p class="hint">Swipe or tap: ← missed · got it → · Space flips</p></div>';

/* ---------- render ---------- */
function render(top){
  if(ui.deck && !S.decks[ui.deck]) ui.deck=null;
  if(ui.folder && !S.folders[ui.folder]) ui.folder=null;
  var app=$('#app'), html;
  if(ui.tab==='study' && ui.study) html=studyView();
  else {
    if(ui.tab==='study') ui.tab='dash';
    html=header()+(ui.tab==='dash'?dashView():ui.tab==='prog'?progView():ui.tab==='rew'?rewView():ui.tab==='vault'?vaultView():(ui.deck?deckView():libView()));
  }
  app.innerHTML=html; dirty=false;
  var nb=document.getElementById('navbar'); if(nb){ var inStudy=(ui.tab==='study'&&!!ui.study); nb.hidden=inStudy; if(!inStudy) nb.innerHTML=navHTML(); } document.body.classList.toggle('studying',ui.tab==='study'&&!!ui.study); if(ui.tab==='vault') hydrateVault();
  updateSync(); hydrateIdb(app);
  if(ui.focusComposer){ ui.focusComposer=false; var q=$('#cq'); if(q) q.focus(); }
  if(top) window.scrollTo(0,0);
}
function softRender(){
  var a=document.activeElement, typing=a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('#app').contains(a);
  if(ui.tab==='study' || typing || !$('#modal').hidden){ dirty=true; return; }
  render();
}

/* ---------- modal / toast ---------- */
var modalEl=$('#modal'), toastT=null;
function openModal(inner,wire){
  var wasClosed = modalEl.hidden;
  modalEl.innerHTML='<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true">'+inner+'</div>';
  modalEl.hidden=false;
  if(wasClosed) pushNavState({view:'modal'});
  modalEl.querySelector('.scrim').onclick=function(){ closeModal(false); };
  Array.prototype.forEach.call(modalEl.querySelectorAll('[data-close]'),function(b){ b.onclick=function(){ closeModal(false); }; });
  hydrateIdb(modalEl);
  if(wire) wire(modalEl);
  var f=modalEl.querySelector('[autofocus]')||modalEl.querySelector('input:not([type=checkbox]):not([type=file]),textarea,select');
  if(f) f.focus();
}
function closeModal(skipHistory){
  if(modalEl.hidden) return;
  modalEl.hidden=true;
  modalEl.innerHTML='';
  if(!skipHistory) popNavSync();
  if(dirty) render();
}
function toast(t){
  var el=$('#toast'); el.textContent=t; el.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(function(){ el.hidden=true; },2600);
}
function confirmBox(title,msg,label,fn){
  openModal('<h3>'+esc(title)+'</h3><p class="muted">'+esc(msg)+'</p><div class="row end"><button class="btn ghost" data-close>Cancel</button><button class="btn danger" id="ok">'+esc(label)+'</button></div>',function(r){
    r.querySelector('#ok').onclick=function(){ closeModal(true); fn(); };
  });
}
function nameModal(title,label,value,cta,fn){
  openModal('<h3>'+esc(title)+'</h3><form id="nf" style="display:grid;gap:14px"><label class="fld"><span>'+esc(label)+'</span><input id="nm" maxlength="80" value="'+esc(value||'')+'" autocomplete="off"></label><div class="row end"><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn primary" type="submit">'+esc(cta)+'</button></div></form>',function(r){
    r.querySelector('#nf').onsubmit=function(e){ e.preventDefault(); var v=r.querySelector('#nm').value.trim(); if(!v){ r.querySelector('#nm').focus(); return; } closeModal(true); fn(v); };
    var i=r.querySelector('#nm'); i.focus(); i.select();
  });
}
function folderOptions(exclude,selected){
  var opts='<option value="">Library (top level)</option>';
  Object.values(S.folders).sort(function(a,b){ return folderLabel(a.id).localeCompare(folderLabel(b.id)); }).forEach(function(f){
    if(exclude && exclude.indexOf(f.id)>-1) return;
    opts+='<option value="'+esc(f.id)+'"'+(f.id===selected?' selected':'')+'>'+esc(folderLabel(f.id))+'</option>';
  });
  return opts;
}

function moveModal(kind,id){
  var it=kind==='folder'?S.folders[id]:S.decks[id];

    r.querySelector('#mf').onsubmit=function(e){

function deleteItem(kind,id){

    var d=S.decks[id];

function cardModal(cardId){

function noteModal(k){

function flip(){
  var s=ui.study; if(!s||s.done||s.flipping||s.busy) return;
  var el=$('.flash');

  s.flipping=true; el.classList.remove('drag'); el.style.transform=''; el.style.boxShadow='';
  el.classList.add('flip-out');

}
function cardTilt(dx){ return Math.max(-16,Math.min(16,dx/26)); }

/* Flies the card off to the side from wherever it is (centre for the buttons, the finger's spot for a swipe),
   using exactly the same tilt/colour/label as a manual drag so it feels like the card is being thrown. */
function answer(ok,fromDx,vel){
  var s=ui.study; if(!s||s.done||s.busy||s.flipping) return;
  var go=function(){ s.busy=false; s.results[s.queue[s.i]]=ok; s.i++; s.flipped=false; s.en=true; if(s.i>=s.queue.length) finishStudy(); else render(); };
  var el=$('.flash');
  if(!el){ go(); return; }
  s.busy=true;
  var dir=ok?1:-1, start=fromDx||0, target=dir*(window.innerWidth+60), dist=Math.abs(target-start);
  var swipe=fromDx!=null, speed=Math.max(Math.abs(vel||0),swipe?1.1:0);
  var dur=swipe?Math.max(160,Math.min(320,dist/Math.max(speed,.9))):340;
  el.classList.add('drag'); el.style.opacity='1';
  var t0=null, ease=swipe?function(t){ return 1-Math.pow(1-t,2); }:function(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; };
  var step=function(now){
    if(t0===null) t0=now;
    var t=Math.min(1,(now-t0)/dur), dx=start+(target-start)*ease(t);
    cardPlace(el,dx);
    if(t<1) requestAnimationFrame(step); else go();
  };
  requestAnimationFrame(step);
}
function finishStudy(){
  var s=ui.study, d=S.decks[s.deckId]; if(!d) return;
  var right=0; s.queue.forEach(function(id){ if(s.results[id]) right++; });
  s.right=right; s.total=s.queue.length; s.missed=s.queue.filter(function(id){ return !s.results[id]; });

    s.firstToday=!(day.sets>0);

    });

    day.sessions=[{deck:d.id,name:d.name,total:s.total,correct:right,secs:s.secs,at:Date.now()}].concat(day.sessions||[]).slice(0,40);

function parseDelimited(text,ch){
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"' && cur===''){ q=true; }
    else if(c===ch){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(cur); cur=''; rows.push(row); row=[]; }
    else cur+=c;
  }
  row.push(cur); rows.push(row);
  return rows.filter(function(r){ return r.some(function(x){ return x.trim(); }); });
}
function detectDelim(text){
  var lines=text.split(/\r?\n/).filter(function(l){ return l.trim(); }).slice(0,10);
  if(lines.some(function(l){ return l.indexOf('\t')>-1; })) return 'tab';
  if(lines.length && lines.every(function(l){ return l.indexOf(',')>-1; })) return 'comma';
  if(lines.some(function(l){ return /\s[-–—]\s/.test(l); })) return 'dash';
  if(lines.some(function(l){ return l.indexOf(';')>-1; })) return 'semicolon';
  if(lines.some(function(l){ return l.indexOf(':')>-1; })) return 'colon';
  return 'tab';
}
function fromJSON(j){
  var arr=Array.isArray(j)?j:(j && (j.cards||j.flashcards||j.items));
  if(!Array.isArray(arr)) return null;
  var out=[];
  arr.forEach(function(it){
    var q,a;
    if(Array.isArray(it)){ q=it[0]; a=it[1]; }
    else if(it && typeof it==='object'){
      q=[it.q,it.front,it.question,it.term,it.prompt,it.word].filter(function(x){ return x!=null; })[0];
      a=[it.a,it.back,it.answer,it.definition,it.response,it.meaning].filter(function(x){ return x!=null; })[0];
    }
    if(q!=null && a!=null && String(q).trim() && String(a).trim()) out.push({q:String(q).trim(),a:String(a).trim()});
  });
  return out.length?out:null;
}
function parseText(text,opt){
  text=String(text||'').replace(/^\uFEFF/,'').trim();
  if(!text) return {cards:[],skipped:0,delim:null};
  if(/^[\[{]/.test(text)){ try{ var c=fromJSON(JSON.parse(text)); if(c) return {cards:c,skipped:0,delim:'json'}; }catch(e){} }
  var delim=opt.delim==='auto'?detectDelim(text):opt.delim, rows;
  if(delim==='dash'||delim==='colon'){
    var sep=delim==='dash'?/\s[-–—]\s/:/:/;
    rows=text.split(/\r?\n/).filter(function(l){ return l.trim(); }).map(function(l){
      var m=sep.exec(l); if(!m) return [l.trim()];
      return [l.slice(0,m.index).trim(),l.slice(m.index+m[0].length).trim()];
    });
  } else rows=parseDelimited(text,{tab:'\t',comma:',',semicolon:';'}[delim]||'\t');
  if(opt.header && rows.length) rows.shift();
  var cards=[],skipped=0;
  rows.forEach(function(r){
    if(r.length>=2 && String(r[0]).trim() && String(r[1]).trim()) cards.push({q:String(r[0]).trim(),a:String(r[1]).trim()}); else skipped++;
  });
  return {cards:cards,skipped:skipped,delim:delim};
}

    answer(o.dx>0,o.dx,o.v);

    if((!q&&!pend.q)||(!a&&!pend.a)){ toast('Each side needs text or a picture'); return; }
    var d=clone(S.decks[ui.deck]); var nc={id:'c'+uid(),q:q,a:a,box:0,seen:0,right:0}; if(pend.q) nc.qi=pend.q; if(pend.a) nc.ai=pend.a; d.cards.push(nc); pend.q=''; pend.a='';
    putDeck(d); ui.focusComposer=true; render();
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape' && !modalEl.hidden){ closeModal(false); return; }
  if((e.ctrlKey||e.metaKey) && e.key==='Enter'){
    var f=e.target.closest && e.target.closest('form[data-form="addcard"]'); if(f){ e.preventDefault(); f.requestSubmit(); return; }
  }
  var t=e.target;
  if((e.key==='Enter'||e.key===' ') && t && t.getAttribute && t.getAttribute('role')==='button' && t.dataset.act){ e.preventDefault(); t.click(); return; }
  if(ui.tab==='study' && ui.study && modalEl.hidden && !/^(INPUT|TEXTAREA|SELECT)$/.test((t&&t.tagName)||'')){
    var s=ui.study;
    if(s.done) return;
    if(e.key===' '||e.key==='Enter'){ if(!(t&&t.tagName==='BUTTON')){ e.preventDefault(); if(!s.flipped) flip(); } }
    else if(e.key==='ArrowLeft'||e.key==='1'){ if(s.flipped) answer(false); }
    else if(e.key==='ArrowRight'||e.key==='2'){ if(s.flipped) answer(true); }
    else if(e.key==='ArrowUp'||e.key==='ArrowDown'){ e.preventDefault(); flip(); }
    else if(e.key==='s'||e.key==='S'){ starStudy(); }
  }
});

try{ if(typeof claude!=='undefined' && claude && claude.use) claude.use('downloads').then(function(x){ DL=x||null; },function(){}); }catch(e){}

},1000);
setTimeout(function(){ var sp=$('#splash'); if(sp){ sp.classList.add('out'); setTimeout(function(){ sp.remove(); },500); } },1700);
})();
